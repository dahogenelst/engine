version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 10
    ignore:
      # internal gems come from dahogenelst/* via git and move through the CI cascade
      - dependency-name: 'locomotivecms*'
      - dependency-name: custom_fields
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm  # the React editor; CI rebuilds and commits editor.js on these PRs
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # peer of react-draft-wysiwyg/html-to-draftjs, must match draft-js' immutable 3; drop with the rich text editor
      - dependency-name: immutable
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
